name: Deploy website

on:
  push:
    branches:
      - '**'
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.ref }}
  # Finish production deployments; replace outdated previews on the same branch.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  deploy:
    name: Build and deploy
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      deployments: write
    defaults:
      run:
        working-directory: website
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static site
        run: pnpm build

      - name: Set up Python for browser regression
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'

      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright==1.58.0'
          python -m playwright install --with-deps chromium firefox webkit

      - name: Test header in real browsers
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory out > /tmp/rae-website-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          python - <<'PYREADY'
          import time
          import urllib.request
          for attempt in range(30):
              try:
                  urllib.request.urlopen('http://127.0.0.1:8765/docs/', timeout=1).close()
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('Static website server did not start')
          PYREADY
          python tests/scroll_e2e.py http://127.0.0.1:8765 out

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          workingDirectory: website
          # Wrangler reads the checked-out branch: main is production,
          # every other branch gets a preview in the same Pages project.
          command: pages deploy out --project-name=reverse-api-engineer

      - name: Add deployment links to summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          BRANCH_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          printf '### Website deployment\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf '[Open deployment](%s)\n' "$DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$BRANCH_URL" ]; then
            printf '\n[Open branch preview](%s)\n' "$BRANCH_URL" >> "$GITHUB_STEP_SUMMARY"
          fi
