name: Live client generation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/ci/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/generation-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/ci/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/generation-e2e.yml'

permissions:
  contents: read

concurrency:
  group: live-generation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: ${{ matrix.os }} / ${{ matrix.language }} / OpenCode free
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-latest, ubuntu-latest]
        language: [powershell, python]
    env:
      UV_PYTHON: '3.13'
      PYTHONIOENCODING: utf-8
      RAE_OPENCODE_PACKAGE: opencode-ai@1.18.31
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          python-version: '3.13'
          enable-cache: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: uv sync --locked --all-extras
      - name: Install browser matching rae-playwright-mcp
        run: npx --yes playwright@1.58.0-alpha-2025-12-29 install --with-deps chromium
      - name: Generate and execute a real client against fresh fixture data
        run: uv run python scripts/ci/generation_e2e.py --language ${{ matrix.language }}
