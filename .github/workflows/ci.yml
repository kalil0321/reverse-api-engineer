name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR at a time; a newer push cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# setup-uv stopped publishing floating major tags after v7, so it is pinned to
# an exact release tag instead. Bump it when a newer release is out.
jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      # No explicit python-version: uv picks up the interpreter from .python-version.
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests

  # mypy reports ~170 pre-existing errors across src/. Until those are fixed the
  # job is informational only: it runs on every PR so regressions are visible
  # in the logs, but it never blocks a merge. Remove `continue-on-error` once
  # `uv run mypy src` is clean.
  typecheck:
    name: mypy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run mypy src

  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # --locked: fail loudly if uv.lock is stale instead of silently re-resolving.
      - run: uv sync --all-extras --locked
      - run: uv run pytest -q
