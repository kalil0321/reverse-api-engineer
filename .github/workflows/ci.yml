name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One run per branch/PR at a time; a newer push cancels the stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Pin action revisions so upstream tag changes cannot alter CI code.
jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      # No explicit python-version: uv picks up the interpreter from .python-version.
      - run: uv sync --all-extras --locked
      - run: uv run ruff check src tests

  # mypy reports ~170 pre-existing errors across src/. Until those are fixed the
  # job is informational only: it runs on every PR so regressions are visible
  # in the logs, but it never blocks a merge. Remove `continue-on-error` once
  # `uv run mypy src` is clean.
  typecheck:
    name: mypy (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
      - run: uv sync --all-extras --locked
      - run: uv run mypy src

  test:
    name: pytest (py${{ matrix.python-version }}, ${{ matrix.os }})
    timeout-minutes: 15
    runs-on: ${{ matrix.os }}
    env:
      # Make the matrix interpreter explicit for every uv invocation.
      UV_PYTHON: ${{ matrix.python-version }}
      # Exercise real PowerShell execution on every platform; do not silently skip.
      RAE_REQUIRE_PWSH: "1"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      # --locked: fail loudly if uv.lock is stale instead of silently re-resolving.
      - run: uv sync --all-extras --locked
      - name: Verify PowerShell 7+
        shell: pwsh
        run: |
          if ($PSVersionTable.PSVersion.Major -lt 7) { throw 'PowerShell 7+ required' }
      - run: uv run reverse-api-engineer --version
      - run: uv run reverse-api-engineer --help
      - run: uv run pytest -q
